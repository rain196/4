name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            cmake libffi-dev libssl-dev build-essential

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Add swap space (avoid OOM during compile)
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Pin Cython for isolated build envs
        run: echo "cython==0.29.33" > /home/runner/pip-constraints.txt

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug
        env:
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          MAKEFLAGS: -j2
          PIP_CONSTRAINT: /home/runner/pip-constraints.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mard-bead-app-apk
          path: bin/*.apk
